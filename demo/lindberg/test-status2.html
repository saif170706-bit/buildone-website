<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statuslinje-test 2</title>
<style>
  /* Ingen theme-color overhovedet. Her er det sidens egen baggrund der er
     roed — saa viser statuslinjen, om Safari tager farve efter siden. */
  html{background:#cc0000}
  body{margin:0;height:200vh;background:#cc0000;color:#fff;
    font:600 18px/1.5 -apple-system,Segoe UI,Arial,sans-serif}
  p{padding:24px}
</style>
</head>
<body>
  <p>Testside 2 af 2 — her er selve siden rød, og der er ingen oplyst farve.<br><br>
  <b>Rød statuslinje</b> → Safari tager farve efter sidens baggrund. Så kan vi styre den.<br>
  <b>Hvid statuslinje</b> → Den kan slet ikke farves på din iPhone.</p>
</body>
</html>
