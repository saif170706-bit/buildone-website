<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Statuslinje-test 3</title>
<style>
  /* Siden er roed, men et hvidt lag daekker hele fladen ovenpaa.
     Roed linje  -> Safari laeser sidens farve som en egenskab.
     Hvid linje  -> Safari aflaeser de pixels der faktisk tegnes. */
  html,body{margin:0;background:#cc0000}
  .dakke{position:relative;min-height:200vh;background:#ffffff;color:#111;
    font:600 18px/1.5 -apple-system,Segoe UI,Arial,sans-serif}
  p{padding:24px;margin:0}
</style>
</head>
<body>
  <div class="dakke">
    <p>Testside 3 af 3.<br><br>
    Siden er rød, men et hvidt lag dækker den helt.<br><br>
    <b>Rød statuslinje</b> → Safari læser sidens farve.<br>
    <b>Hvid statuslinje</b> → Safari aflæser det, der tegnes.</p>
  </div>
</body>
</html>
