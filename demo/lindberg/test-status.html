<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Hele formaalet med siden: kun denne ene linje er i spil. -->
<meta name="theme-color" content="#cc0000">
<title>Statuslinje-test</title>
<style>
  /* Siden er HVID. Kun <meta theme-color> er roed — saa viser statuslinjen
     entydigt, om Safari laeser den farve eller ej. */
  html,body{margin:0;height:200vh;background:#ffffff;color:#111;
    font:600 18px/1.5 -apple-system,Segoe UI,Arial,sans-serif}
  p{padding:24px}
</style>
</head>
<body>
  <p>Testside 1 af 2 — siden er helt hvid, men den <i>beder</i> om en rød statuslinje.<br><br>
  Kig øverst, hvor klokken står.<br><br>
  <b>Rød</b> → Safari læser farven, vi oplyser.<br>
  <b>Hvid</b> → Safari ignorerer den.<br><br>
  Åbn derefter <a href="test-status2.html">testside 2</a>.</p>
</body>
</html>
