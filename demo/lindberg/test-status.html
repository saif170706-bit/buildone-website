  <p>Testside.<br><br>
  Kig på statuslinjen øverst, hvor klokken står.<br><br>
  <b>Er den rød?</b> → Safari læser farven fra siden.<br><br>
  <b>Er den hvid?</b> → Safari ignorerer den på din telefon.<br><br>
  Rul gerne lidt ned og se, om svaret ændrer sig.</p>
