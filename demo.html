<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pote &amp; Pels Dyreklinik — demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#12988a; --ink:#12312f; --orange:#f4794a; --cream:#fdfaf6; --grey:#6d8180;
  --f:"Poppins",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
img{display:block;max-width:100%}

.page{min-height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;
  padding:2.6% 4.2%;gap:3%;flex:0 0 auto}
.lg{display:flex;align-items:center;gap:.5em;font-weight:800;font-size:clamp(13px,1.5vw,20px)}
.lg .m{width:2em;height:2em;border-radius:50%;background:var(--teal);color:#fff;
  display:grid;place-items:center;font-size:.62em}
.nv{display:flex;gap:clamp(10px,2.2vw,30px);font-size:clamp(9px,1.02vw,13px);
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5d716f}
.nv b{color:var(--ink)}
.ic{display:flex;gap:clamp(8px,1.3vw,16px);font-size:clamp(10px,1.15vw,15px);color:#5d716f}
@media(max-width:640px){ .nv{display:none} }

/* ---------- hero ---------- */
.hero{flex:1;position:relative;display:grid;place-items:center;overflow:hidden}
.bg{position:absolute;inset:0}
.bg img{width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(253,250,246,.93) 0%,rgba(253,250,246,.74) 42%,rgba(253,250,246,.30) 100%)}
.mid{position:relative;text-align:center;padding:0 6%;max-width:80%}
.eb{font-size:clamp(9px,1.05vw,13px);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--teal);margin-bottom:.9em}
h1{font-size:clamp(24px,4.9vw,62px);line-height:1.04;letter-spacing:-.025em;
  font-weight:800;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--teal);display:block}
.sub{margin-top:.95em;font-size:clamp(10px,1.28vw,17px);color:var(--grey);line-height:1.55;
  max-width:26em;margin-left:auto;margin-right:auto}
.cta{display:inline-block;margin-top:1.5em;background:var(--orange);color:#fff;font-weight:700;
  font-size:clamp(10px,1.15vw,15px);padding:.85em 2.1em;border-radius:999px;
  box-shadow:0 .6em 1.4em -.6em rgba(244,121,74,.75)}
</style>
</head>
<body>
<div class="page">

  <header class="hd">
    <div class="lg"><span class="m">🐾</span>Pote &amp; Pels</div>
    <nav class="nv"><b>Forside</b><span>Behandlinger</span><span>Butik</span><span>Om os</span><span>Kontakt</span></nav>
    <div class="ic"><span>☰</span><span>🔍</span><span>🌐</span></div>
  </header>

  <div class="hero">
    <div class="bg">
      <img src="/assets/demo/hero-pets.jpg" alt="Hund og kat sammen i græsset">
      <div class="veil"></div>
    </div>
    <div class="mid">
      <div class="eb">Dyreklinik i Aarhus</div>
      <h1>Vi passer<em>på dine dyr</em></h1>
      <p class="sub">Dyrlæge, pelspleje og pasning — samlet ét sted.</p>
      <a href="#" class="cta">Book en tid</a>
    </div>
  </div>

</div>
</body>
</html>
