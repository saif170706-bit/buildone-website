<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Et browservindue med den færdige side og en knap, der hedder Gå live">
<!--
  Trin 03 — "Du siger ja, vi går live".

  Tegnet frem for fotograferet: der findes ikke et stockbillede af
  nogen, der trykker udgiv, og en finger på en tilfældig tast siger
  ikke det samme. Skriften er bevidst et systemfont-stak — en
  webfont bliver ikke indlæst, når en SVG vises gennem <img>.
-->
<defs>
  <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e7f3f5"/>
    <stop offset="1" stop-color="#f7fbfc"/>
  </linearGradient>
  <linearGradient id="helt" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0fa4af"/>
    <stop offset="1" stop-color="#024950"/>
  </linearGradient>
  <filter id="skygge" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#003135" flood-opacity=".22"/>
  </filter>
  <filter id="skygge-lille" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#003135" flood-opacity=".28"/>
  </filter>
  <clipPath id="vindue"><rect x="118" y="86" width="840" height="520" rx="16"/></clipPath>
</defs>

<rect width="1200" height="675" fill="url(#bag)"/>
<circle cx="160" cy="120" r="230" fill="#0fa4af" opacity=".07"/>
<circle cx="1080" cy="600" r="260" fill="#024950" opacity=".06"/>

<!-- Browservinduet -->
<g filter="url(#skygge)">
  <rect x="118" y="86" width="840" height="520" rx="16" fill="#ffffff"/>
</g>
<g clip-path="url(#vindue)">
  <!-- Adresselinje -->
  <rect x="118" y="86" width="840" height="56" fill="#f1f6f7"/>
  <circle cx="150" cy="114" r="6" fill="#dbe7e9"/>
  <circle cx="172" cy="114" r="6" fill="#dbe7e9"/>
  <circle cx="194" cy="114" r="6" fill="#dbe7e9"/>
  <rect x="224" y="100" width="300" height="28" rx="14" fill="#ffffff"/>
  <path d="M243 114a5 5 0 0110 0v4h-10z" fill="none" stroke="#0fa4af" stroke-width="2.2"/>
  <rect x="241" y="113" width="14" height="10" rx="2" fill="#0fa4af"/>
  <text x="266" y="119" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#5a7a7d">ditfirma.dk</text>

  <!-- Siden inde i vinduet -->
  <rect x="118" y="142" width="840" height="60" fill="#ffffff"/>
  <circle cx="160" cy="172" r="12" fill="#024950"/>
  <rect x="182" y="166" width="78" height="12" rx="6" fill="#003135"/>
  <rect x="700" y="164" width="46" height="10" rx="5" fill="#cde4e6"/>
  <rect x="762" y="164" width="46" height="10" rx="5" fill="#cde4e6"/>
  <rect x="824" y="156" width="96" height="28" rx="14" fill="#0fa4af"/>
  <rect x="118" y="202" width="840" height="1" fill="#e4eef0"/>

  <rect x="118" y="203" width="840" height="403" fill="#fbfdfd"/>
  <rect x="158" y="246" width="330" height="22" rx="11" fill="#003135"/>
  <rect x="158" y="284" width="250" height="22" rx="11" fill="#003135"/>
  <rect x="158" y="332" width="300" height="11" rx="5.5" fill="#c8dfe2"/>
  <rect x="158" y="354" width="258" height="11" rx="5.5" fill="#c8dfe2"/>
  <rect x="158" y="396" width="124" height="38" rx="19" fill="#024950"/>
  <rect x="296" y="396" width="110" height="38" rx="19" fill="none" stroke="#c8dfe2" stroke-width="2"/>
  <rect x="548" y="246" width="362" height="222" rx="12" fill="url(#helt)" opacity=".92"/>
  <rect x="158" y="492" width="200" height="74" rx="12" fill="#ffffff" stroke="#e4eef0"/>
  <rect x="378" y="492" width="200" height="74" rx="12" fill="#ffffff" stroke="#e4eef0"/>
  <rect x="598" y="492" width="200" height="74" rx="12" fill="#ffffff" stroke="#e4eef0"/>
</g>
<rect x="118" y="86" width="840" height="520" rx="16" fill="none" stroke="#dbe9eb" stroke-width="1.5"/>

<!-- Udgiv-panelet -->
<g filter="url(#skygge-lille)">
  <rect x="690" y="400" width="400" height="196" rx="18" fill="#ffffff"/>
</g>
<rect x="690" y="400" width="400" height="196" rx="18" fill="none" stroke="#e1edef"/>
<text x="726" y="452" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#0fa4af">KLAR TIL UDGIVELSE</text>
<text x="726" y="486" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#003135">ditfirma.dk</text>
<text x="726" y="512" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#5a7a7d">Domæne, SSL og hosting er klar</text>
<rect x="726" y="530" width="168" height="46" rx="23" fill="#0fa4af"/>
<text x="810" y="559" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">Gå live</text>

<!-- Markøren på knappen -->
<g transform="translate(856 548)">
  <circle cx="10" cy="10" r="26" fill="#ffffff" opacity=".22"/>
  <path d="M0 0l0 26 6.4-6.9 4.3 9.6 5.2-2.4-4.4-9.5 9.3-1z" fill="#003135" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
</g>
</svg>
